[advisories]
ignore = [
  "RUSTSEC-2024-0388", # derivative; transitive via alloy
  "RUSTSEC-2024-0436", # paste; transitive via alloy
  "RUSTSEC-2026-0173", # proc-macro-error2; transitive proc-macro dependency
  "RUSTSEC-2026-0204", # crossbeam-epoch; transitive via rayon

  "RUSTSEC-2026-0385", # ctutils; transitive through hopr-types cryptography
  "RUSTSEC-2026-0387", # crypto-bigint 0.5.x; transitive through hopr-types cryptography
  "RUSTSEC-2026-0386", # tokio; transitive async runtime dependency

  # rustls stack; transitive TLS dependency.
  "RUSTSEC-2026-0346", # rustls
  "RUSTSEC-2026-0347", # rustls
  "RUSTSEC-2026-0348", # rustls
  "RUSTSEC-2026-0349", # rustls
  "RUSTSEC-2026-0382", # rustls-webpki
  "RUSTSEC-2026-0383", # webpki-root-certs
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
fetch = true
path  = "~/.cargo/advisory-db"
stale = false
url   = "https://github.com/RustSec/advisory-db.git"

[output]
deny      = ["warnings"]
format    = "terminal"   # "terminal" (human readable report) or "json"
quiet     = false        # Only print information on error
show_tree = true         # Show inverse dependency trees along with advisories (default: true)

[target]
arch = [
  "aarch64",
  "x86_64",
] # Ignore advisories for CPU architectures other than these
os = [
  "linux",
  "macos",
  "windows",
] # Ignore advisories for operating systems other than these

[yanked]
enabled      = true # Warn for yanked crates in Cargo.lock (default: true)
update_index = true # Auto-update the crates.io index (default: true)
