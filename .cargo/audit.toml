[advisories]
ignore = [
  "RUSTSEC-2024-0388", # `derivative` unmaintained; pulled by ark-ff (via ruint -> alloy-primitives and hopr-types' babyjubjub stack); drop once ark-ff 0.5 is used everywhere
  "RUSTSEC-2024-0436", # `paste` unmaintained; pulled by alloy-primitives -> alloy -> hopr-bindings; drop once alloy replaces it
  "RUSTSEC-2026-0173", # `proc-macro-error2` unmaintained; pulled by aquamarine -> hopr-types; proc-macro only, not reachable at runtime
  "RUSTSEC-2026-0204", # `crossbeam-epoch` 0.9.21 pulled by crossbeam-deque -> rayon-core -> rayon -> hopr-types; drop once rayon upgrades
  "RUSTSEC-2026-0385", # `ctutils` 0.4.6 pulled by crypto-bigint 0.7.10 -> elliptic-curve 0.14.1 (babyjubjub-ec, k256 0.14 in hopr-types); needs a hopr-types bump
  "RUSTSEC-2026-0387", # `crypto-bigint` 0.5.5 timing variability, pulled by elliptic-curve 0.13.8 -> alloy-signer -> alloy -> hopr-bindings; fix needs elliptic-curve 0.14.x — needs an alloy bump
]
informational_warnings = ["unmaintained"]
severity_threshold = "low"

[database]
fetch = true
path  = "~/.cargo/advisory-db"
stale = false
url   = "https://github.com/RustSec/advisory-db.git"

[output]
deny      = ["warnings"]
format    = "terminal"   # "terminal" (human readable report) or "json"
quiet     = false        # Only print information on error
show_tree = true         # Show inverse dependency trees along with advisories (default: true)

[target]
arch = [
  "aarch64",
  "x86_64",
] # Ignore advisories for CPU architectures other than these
os = [
  "linux",
  "macos",
  "windows",
] # Ignore advisories for operating systems other than these

[yanked]
enabled      = true # Warn for yanked crates in Cargo.lock (default: true)
update_index = true # Auto-update the crates.io index (default: true)
