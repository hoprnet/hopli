---
name: Branches
on:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: branches-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload
    uses: hoprnet/hopr-workflows/.github/workflows/tests.yaml@43c833e72dffe4f2f3be60193733e5657f8aa0d7 # workflow-tests-v7.0.0
    with:
      repo_sha: ${{ github.sha }}
      enable_unit_tests: false
      enable_integration_tests: false
      enable_unit_coverage: true
      unit_coverage_command: "nix develop .#coverage -c cargo llvm-cov --workspace --lib --lcov --output-path coverage.lcov"
      runner_unit: depot-ubuntu-24.04-4
    secrets:
      cachix_auth_token: ${{ secrets.CACHIX_AUTH_TOKEN }}
  notify:
    name: Notify failure
    permissions: {}
    needs:
      - coverage
    if: ${{ always() && needs.coverage.result == 'failure' }}
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Notify failed coverage run on main
        uses: zulip/github-actions-zulip/send-message@f675f2b4eb2a95fae974215476dcb7ad8dfeff6b # v2.0.2
        with:
          api-key: ${{ secrets.ZULIP_API_KEY }}
          email: ${{ secrets.ZULIP_EMAIL }}
          organization-url: "https://hopr.zulipchat.com"
          type: stream
          to: HOPRd
          topic: Core
          content: |
            The coverage run on main has failed: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
